version: '3.8'

services:
  backend:
    build:
      context: ./school-management-backend
      dockerfile: Dockerfile
    container_name: school_management_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/school_db}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-postgres}
    restart: unless-stopped

  frontend:
    build:
      context: ./school-management-frontend
      dockerfile: Dockerfile
    container_name: school_management_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
