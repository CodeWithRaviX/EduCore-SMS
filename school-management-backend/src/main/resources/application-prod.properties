# Production Profile Configuration
server.port=${PORT:8080}

# Database Configuration (Environment Variable Driven)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-quiet-hall-b3krws99-pooler.c-4.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_IcvB23TaYCHO}

# Production Connection Pool Tuning (Neon Serverless PgBouncer Pooler)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA Production Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
