# ===================================================================
# School Management System - Production Configuration
# ===================================================================
server.port=${PORT:8080}
server.shutdown=graceful

# -------------------------------------------------------------------
# HTTP Response Compression (GZIP)
# -------------------------------------------------------------------
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# -------------------------------------------------------------------
# Neon Serverless PostgreSQL Cloud Database
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-quiet-hall-b3krws99-pooler.c-4.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_IcvB23TaYCHO}

# -------------------------------------------------------------------
# HikariCP Production Connection Pool Tuning (for Neon Pooler)
# -------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000

# -------------------------------------------------------------------
# JPA / Hibernate Production Settings
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Spring Boot Actuator Health Monitoring
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
